<button onclick="pairDikhao()">Pair Code</button>
<button onclick="qrDikhao()">QR Scan</button>

<div id="pBox">
<input id="num" placeholder="92300...">
<button onclick="codeLo()">Code Lo</button>
<h1 id="codeAgya"></h1>
</div>

<div id="qBox" style="display:none">
<button onclick="qrLo()">QR Lo</button>
<div id="qrAgya"></div>
</div>

<script>
function pairDikhao(){
 document.getElementById("pBox").style.display="block";
 document.getElementById("qBox").style.display="none";
}
function qrDikhao(){
 document.getElementById("pBox").style.display="none";
 document.getElementById("qBox").style.display="block";
}

async function codeLo(){
 let number = document.getElementById("num").value;
 document.getElementById("codeAgya").innerText="wait...";
 let res = await fetch(`/code?number=${number}`);
 let data = await res.json();
 document.getElementById("codeAgya").innerText=data.code || data.message;
}

async function qrLo(){
 document.getElementById("qrAgya").innerHTML="QR loading...";
 let res = await fetch(`/qr`);
 let data = await res.json();
 document.getElementById("qrAgya").innerHTML=`<img src="${data.qr}" width="300" />`;
}
</script>
